apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: app-configs
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/maooz4426/maoz-k8s.git
        revision: main
        directories:
          - path: apps/authentik/authentik-config
  template:
    metadata:
      name: '{{ .path.basename }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/maooz4426/maoz-k8s.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .path.basename | trimSuffix "-config" }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
