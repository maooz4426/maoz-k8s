apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/maooz4426/maoz-k8s.git      
    targetRevision: main
    path: apps               # apps/ ディレクトリを監視(bootstrap/ は監視しない=自分自身を管理しない)
    directory:
      recurse: true          # apps/ 配下を再帰的に拾う            
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
