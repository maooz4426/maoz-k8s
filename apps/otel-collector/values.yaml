# 参考実装: https://grafana.com/grafana/dashboards/25255-claude-code-metrics-prometheus/
mode: deployment

replicaCount: 1

fullnameOverride: otel-collector

image:
  repository: otel/opentelemetry-collector-contrib

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

ports:
  # Tailscale経由で送るのでgRPC(4317)でも届くが、デバッグが楽なHTTP(4318)だけ有効にする。
  otlp:
    enabled: false
  otlp-http:
    enabled: true
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

config:
  processors:
    delta_to_cumulative: {}
  receivers:
    otlp:
      protocols:
        grpc: null
        http:
          endpoint: ${env:MY_POD_IP}:4318
          metrics_url_path: /otel/v1/metrics
    jaeger: null
    prometheus: null
    zipkin: null
  exporters:
    # push型のremote writeを使う。pull型のprometheus exporterだとPrometheus側がotel-collectorをスクレイプする設定が別途必要なため不採用。
    prometheusremotewrite:
      endpoint: http://prometheus-server.monitoring.svc.cluster.local/prometheus/api/v1/write
    debug: null
  service:
    pipelines:
      traces: null
      logs: null
      metrics:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - delta_to_cumulative
          - batch
        exporters:
          - prometheusremotewrite
