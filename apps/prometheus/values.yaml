server:
  persistentVolume:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  extraFlags:
    - web.enable-lifecycle
  extraArgs:
    web.enable-remote-write-receiver: null
  prefixURL: /prometheus
  baseURL: https://k3s.maooz4426.com/prometheus

alertmanager:
  enabled: false #一旦offに

pushgateway:
  enabled: false

nodeExporter:
  enebled: true
