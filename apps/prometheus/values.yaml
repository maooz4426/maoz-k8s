server:
  persistentVolume:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  extraFlags:
    - web.enable-otlp-receiver
    - web.external-url=https://k3s.maooz4426.com/prometheus
    - web.route-prefix=/prometheus

alertmanager:
  enabled: false #一旦offに

pushgateway:
  enabled: false

nodeExporter:
  enebled: true
