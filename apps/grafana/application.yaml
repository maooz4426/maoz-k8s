apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts   
    chart: grafana
    targetRevision: 10.5.15   
    helm:
      valuesObject:
        deploymentStrategy:
          type: Recreate
        persistence:
          enabled: true
          size: 2Gi
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        service:
          type: ClusterIP
          port: 80
        envFromSecret: grafana-secrets
        grafana.ini:
          server:
            root_url: https://grafana.maooz4426.com
          auth.generic_oauth:
            enabled: true
            name: Authentik
            allow_sign_up: true
            scopes: "openid email profile"
            auth_url: https://auth.maooz4426.com/application/o/authorize/
            token_url: https://auth.maooz4426.com/application/o/token/
            api_url: https://auth.maooz4426.com/application/o/userinfo/
            role_attribute_path: "'Admin'"
            auto_login: false
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true  

