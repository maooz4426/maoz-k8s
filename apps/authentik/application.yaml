apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.goauthentik.io
    chart: authentik
    targetRevision: "2026.5.6"
    helm:
      valuesObject:
        authentik:
          log_level: info
          existingSecret:
            secretName: authentik-secret
        global:
          envFrom:
            - secretRef:
                name: authentik-secret
        postgresql:
          enabled: true
          auth:
            existingSecret: authentik-secret
            secretKeys:
              adminPasswordKey: postgres-password
              userPasswordKey: password
        server:
          replicas: 1
          ingress:
            enabled: false
        worker:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
